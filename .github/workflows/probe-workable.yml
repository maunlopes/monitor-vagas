name: Probe Workable (temporario)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          slugs="stone nubank ifood picpay creditas quintoandar loft ebanx vtex hotmart pipefy olist contaazul neon c6bank inter clara gympass wellhub cloudwalk dock loggi cora alice warren starkbank rappi kavak magalu dlocal wise remote-technology deel gitlab figma miro notion canva toptal bairesdev ciandt thoughtworks globant mjv zup radix ilia brq luby softplan involves nelogica take zenvia unico neoway jusbrasil clicksign rdstation totvs sankhya linx nuvemshop tiendanube omie contabilizei asaas iugu pagarme flash caju alelo pluxee swile azos pier sami porto sulamerica fleury dasa reclameaqui petlove zenklub cobli kovi buser madeiramadeira olx movida localiza 99 agibank bmg bancopan bv btg xp sicredi getnet cielo sumup pagbank clearsale b3 centauro natura boticario ambev itau bradesco santander renner magazineluiza vivo tim claro hapvida cogna descomplica alura isaac energisa engie raizen suzano gerdau vale embraer weg conductor celcoin fitbank qitech bankly matera zoop fcamara foursys actdigital mirante capgemini accenture stefanini tivit dtidigital cwi southsystem sysmap venturus objective tqi zallpy ecore ilegra eldorado cesar nttdata pismo mercadopago recargapay digio sofisa eurofarma ache hypera more more-tecnologia opea icatu liberty mapfre allianz zurich"
          for slug in $slugs; do
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -m 10 -X POST -H 'content-type: application/json' -d '{}' "https://apply.workable.com/api/v3/accounts/$slug/jobs")
            if [ "$code" = "200" ]; then
              total=$(python3 -c "import json;print(json.load(open('/tmp/r.txt')).get('total',0))")
              if [ "$total" != "0" ]; then
                echo "OK $slug: $total vagas"
              fi
            fi
            sleep 0.5
          done
